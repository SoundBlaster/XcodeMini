name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: macOS build (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      GIT_TERMINAL_PROMPT: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version
          [[ "$(xcodebuild -version | awk '/^Xcode / { print $2 }')" == 27.* ]]

      - name: Install pinned XcodeGen
        run: |
          bash Scripts/ci/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate and verify Xcode project
        run: |
          xcodegen generate --spec project.yml
          git diff --exit-code -- XcodeMini.xcodeproj/project.pbxproj

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project XcodeMini.xcodeproj \
            -scheme XcodeMini \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/XcodeMini.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Preserve build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcodemini-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/XcodeMini.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
